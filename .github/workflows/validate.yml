name: validate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: Install Claude Code
        run: |
          npm install --global --ignore-scripts @anthropic-ai/claude-code@2.1.282
          node "$(npm root --global)/@anthropic-ai/claude-code/install.cjs"
          claude --version
      - name: Validate the marketplace and the plugin
        run: claude plugin validate . --strict
      - name: Check public vocabulary
        run: ./scripts/check-vocabulary.sh
      - name: Test the confirmation hook
        run: ./scripts/test-hook.sh
